  <!-- Permissions Policy shim: transparently reroutes legacy third-party 'unload' listeners to 'pagehide' to prevent Chrome unload Permissions-Policy violations and preserve bfcache -->
  <script>
    (function () {
      try {
        var proto = (typeof EventTarget !== 'undefined' && EventTarget.prototype) || (typeof window !== 'undefined' && window);
        if (proto && proto.addEventListener) {
          var origAdd = proto.addEventListener;
          proto.addEventListener = function (type, listener, options) {
            if (type === 'unload') {
              return origAdd.call(this, 'pagehide', listener, options);
            }
            return origAdd.apply(this, arguments);
          };
        }
      } catch (e) {}
    })();
  </script>

  <!-- Prevent uncaught promise rejections from third-party SDK telemetry -->
